# Template "Wi-Fi access point". Edit in the app (Settings) or by hand.
name: Wi-Fi access point
prefix: ap
icon: 📶
color: '#06b6d4'
fields:
  - {label: Hostname, unique: warn, reset_on_copy: true}
  - {label: IP Address, type: ip, unique: warn, reset_on_copy: true}
  - {label: Serial/MAC, unique: strict, reset_on_copy: true}
  - {label: Model}
  - {label: SSIDs}
  - {label: Status, type: select, options: [Active, Spare, Retired]}
  - {label: Technical owner, type: ref, relation: technical_owner, target: person}
  - {label: Location, type: ref, relation: located_in, target: location, multiple: false}
relations:
  - {type: connected_to, target: switch}
